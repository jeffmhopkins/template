# cargo-deny policy for the Rust stack (stacks/rust/RULES.md#R-RUST-008). Lives at the repo root
# next to the root Cargo.toml, where `cargo deny check` finds it.
# Every exception (an advisory `ignore`, a licence `exceptions` entry, a `skip`) carries a
# reason. Editing this file is a governance change; the licence list is the maintainer's.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# { id = "RUSTSEC-YYYY-NNNN", reason = "<why it does not apply, and when it expires>" }
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences. Intake replaces this list with the one the maintainer chose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# { crate = "<name>", allow = ["<SPDX id>"] }
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies
# { crate = "<name>@<version>", reason = "<which crate pins it>" }
skip = []
# { crate = "<name>", reason = "<rule id>" }
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
