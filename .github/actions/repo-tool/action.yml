# repo-tool: build `tools/repo` from the checked-out commit and install it as $RUNNER_TEMP/repo.
# The pull_request_target workflows check out the PR's base, so the checker is the base's.
# Editing this file is a governance change.

name: repo-tool
description: Build the repo tool from the checked-out commit.

inputs:
  cache-name:
    description: Cache namespace, usually the job name.
    required: true

outputs:
  path:
    description: Absolute path of the built binary.
    value: ${{ steps.build.outputs.path }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-setup
      with:
        cache-name: ${{ inputs.cache-name }}
    - id: build
      shell: bash
      run: |
        cargo build --release --locked --manifest-path tools/repo/Cargo.toml
        install -m 0755 tools/repo/target/release/repo "$RUNNER_TEMP/repo"
        echo "path=$RUNNER_TEMP/repo" >> "$GITHUB_OUTPUT"
