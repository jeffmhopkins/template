# rust-stack: the Rust stack pack's CI setup, named by `[ci].setup` in stacks/rust/pack.toml.
# Every stack job runs it after rust-setup: `scripts/repo stack setup .stack-setup` copies it
# there, and the job's next step is `uses: ./.stack-setup`. The Rust toolchain and the build
# cache already come from rust-setup, which every job runs for the repo tool, so this adds
# only cargo-deny, for the `deps` job and the sweep.
# Editing this file is a maintainer-only change.

name: rust-stack
description: The Rust stack's CI setup, beyond the toolchain.

inputs:
  job:
    description: The CI job the setup is for (fmt, lint, test, deps or sweep).
    required: false

runs:
  using: composite
  steps:
    - if: inputs.job == 'deps' || inputs.job == 'sweep'
      uses: ./.github/actions/cargo-deny
