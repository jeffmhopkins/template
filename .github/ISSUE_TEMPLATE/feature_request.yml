name: Idea or feature request
description: Suggest something the project should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The maintainer decides scope and timing. Product decisions are recorded as ADRs (docs/adr/).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behaviour you want, and who would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other tools handle it.
