# governance: the checks that read the PR as data and run code from its base only.
#   governance  `repo governance`: governance changes carry the label and the justification
#               section; maintainer-only paths also need the label applied by the maintainer.
#               A Dependabot PR that only re-pins actions is exempt (ADR-0004). Into a
#               `wave/*` base, files as on the default branch are skipped and any other
#               protected path fails: those changes target the default branch.
#   pr-title    `repo pr-title`: the title is a Conventional Commit.
#   lane-guard  `repo lane-guard`: a serial-lane claim is base + 1 and held by this PR, and a
#               lane's files change only with a claim. `--wave` only for a same-repo
#               `wave/*` head into the default branch.
#   head-labels on a push, removes governance-approved: the label counts only for the head
#               it was applied to. Not a required check; it runs on drafts too.
#
# The classification (protected and maintainer-only paths) comes from the base's repo.toml,
# read by the base's tool. Both are maintainer-only paths, as is this file, so the list
# protects itself: a PR can't loosen the check that judges it, nor, without the maintainer,
# the one that judges the next PR.
#
# Runs on pull_request_target, so GitHub takes this file from the PR's base branch. The `tool`
# job checks out the BASE commit, builds the tool from it once, and hands the binary to the
# other jobs as a run artifact. Those jobs check out the base and fetch the PR head as git
# objects only. Nothing from the head is checked out, built or run. The build cache is
# restored here and never saved (ci.yml's `base-tool` job saves it on pushes to main).
# Editing this file is a maintainer-only change.
#
# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.

name: governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read   # the label events of the PR

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PR: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  # [labels].governance in repo.toml.
  GOVERNANCE_LABEL: governance-approved
  # The account whose label application counts as the maintainer's; bootstrap sets it.
  MAINTAINER: ${{ vars.MAINTAINER_LOGIN }}

jobs:
  head-labels:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # removes the label; nothing else
    steps:
      - name: Remove governance-approved after a push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case ",$(jq -r '[.pull_request.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")," in
            *",$GOVERNANCE_LABEL,"*)
              gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$GOVERNANCE_LABEL" || true
              echo "Removed $GOVERNANCE_LABEL: the head moved to $HEAD_SHA. Examine the new head before applying it again." ;;
          esac

  # The base's tool, built once per run for the three jobs below.
  tool:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - id: tool
        uses: ./.github/actions/repo-tool
        with:
          cache-name: base-tool
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-tool
          path: ${{ steps.tool.outputs.path }}
          retention-days: 1
          if-no-files-found: error

  governance:
    needs: tool
    # Not skipped when `tool` fails: a skipped required check counts as passed.
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: The base's tool was built
        env:
          TOOL: ${{ needs.tool.result }}
        run: '[ "$TOOL" = success ] || { echo "::error::the tool job did not succeed ($TOOL)"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo-tool
          path: ${{ runner.temp }}/tool
      - run: chmod +x "$RUNNER_TEMP/tool/repo"
      - name: Fetch the PR head as git objects
        run: |
          git fetch --no-tags origin "$HEAD_SHA" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git cat-file -e "$HEAD_SHA^{commit}"
      - name: PR body and labels from the event
        env:
          ACTION: ${{ github.event.action }}
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"
          # On a push, head-labels removes the label, so this run judges without it.
          if [ "$ACTION" = synchronize ]; then
            echo "LABELS=$(jq -r --arg l "$GOVERNANCE_LABEL" '[.pull_request.labels[].name | select(. != $l)] | join(",")' "$GITHUB_EVENT_PATH")" >> "$GITHUB_ENV"
          else
            echo "LABELS=$(jq -r '[.pull_request.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")" >> "$GITHUB_ENV"
          fi
      - name: Governance changes are labeled and justified
        env:
          REPO: ${{ runner.temp }}/tool/repo
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$MAINTAINER" ]; then
            echo "::error::MAINTAINER_LOGIN not set; run scripts/bootstrap.sh (docs/GETTING-STARTED.md#github)"
            exit 1
          fi
          set +e
          "$REPO" governance --base "$BASE_SHA" --head "$HEAD_SHA" --author "$AUTHOR" \
            --into "$BASE_REF" --main "origin/$DEFAULT_BRANCH" \
            --pr-body "$RUNNER_TEMP/pr-body.md" --labels "$LABELS" | tee "$RUNNER_TEMP/governance.txt"
          status=${PIPESTATUS[0]}
          set -e

          only=$(sed -n 's/^maintainer-only: //p' "$RUNNER_TEMP/governance.txt")
          if [ -n "$only" ]; then
            echo "Maintainer-only paths changed:"
            printf '%s\n' "$only" | sed 's/^/  /'
            case ",$LABELS," in
              *",$GOVERNANCE_LABEL,"*) ;;
              *)
                echo "::error::maintainer-only paths changed: the $GOVERNANCE_LABEL label is missing"
                exit 1 ;;
            esac
            actor=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$GOVERNANCE_LABEL\") | .actor.login" | tail -n 1)
            if [ "$actor" != "$MAINTAINER" ]; then
              echo "::error::maintainer-only paths changed: $GOVERNANCE_LABEL was last applied by '${actor:-nobody}', not by $MAINTAINER"
              exit 1
            fi
            echo "$GOVERNANCE_LABEL applied by $MAINTAINER."
          fi
          exit "$status"

  pr-title:
    needs: tool
    # Not skipped when `tool` fails: a skipped required check counts as passed.
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: The base's tool was built
        env:
          TOOL: ${{ needs.tool.result }}
        run: '[ "$TOOL" = success ] || { echo "::error::the tool job did not succeed ($TOOL)"; exit 1; }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo-tool
          path: ${{ runner.temp }}/tool
      - run: chmod +x "$RUNNER_TEMP/tool/repo"
      - name: Conventional Commit title
        env:
          REPO: ${{ runner.temp }}/tool/repo
          TITLE: ${{ github.event.pull_request.title }}
        run: '"$REPO" pr-title "$TITLE"'

  lane-guard:
    needs: tool
    # Not skipped when `tool` fails: a skipped required check counts as passed.
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: The base's tool was built
        env:
          TOOL: ${{ needs.tool.result }}
        run: '[ "$TOOL" = success ] || { echo "::error::the tool job did not succeed ($TOOL)"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo-tool
          path: ${{ runner.temp }}/tool
      - run: chmod +x "$RUNNER_TEMP/tool/repo"
      - name: Fetch the PR head as git objects
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
      - name: Serial-lane claims
        env:
          REPO: ${{ runner.temp }}/tool/repo
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # A landing PR: a wave branch of this repo into the default branch. The tool also
          # checks that the branch exists on origin.
          wave=()
          if [ "$SAME_REPO" = true ] && [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            case "$HEAD_REF" in wave/*) wave=(--wave --head-ref "$HEAD_REF" --base-ref "$BASE_REF") ;; esac
          fi
          "$REPO" lane-guard --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR" "${wave[@]}"
