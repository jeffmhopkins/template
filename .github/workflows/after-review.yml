# after-review: expensive jobs (other OSes, end to end) that run only once `review-gate` passes,
# each posting a commit status under its own check name. Dormant: it runs only by hand until a
# project turns on the example below. A check it posts becomes required by adding its name to
# repo.toml [checks].required.
# Editing this file is a maintainer-only change.
#
# Third-party actions are pinned to full commit SHAs, with the release in a trailing comment.

name: after-review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dormant:
    runs-on: ubuntu-latest
    steps:
      - run: echo "after-review is dormant. Turn it on with the example in .github/workflows/after-review.yml."

# Example: run after review-gate passes, and report under each check name.
